<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Azlyn's Birthday</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- ✨ SPARKLES -->

    <div class="sparkles">

        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>

    </div>


    <main>

        <!-- 🌻 TITLE -->

        <h1>🌻 Azlyn's 16th Birthday 🌻</h1>

        <p id="message">
            Something special is coming...
        </p>


        <!-- ⏰ COUNTDOWN -->

        <div id="timer">

            <div class="time-box">

                <span id="days">0</span>

                <small>DAYS</small>

            </div>


            <div class="time-box">

                <span id="hours">0</span>

                <small>HOURS</small>

            </div>


            <div class="time-box">

                <span id="minutes">0</span>

                <small>MINUTES</small>

            </div>


            <div class="time-box">

                <span id="seconds">0</span>

                <small>SECONDS</small>

            </div>

        </div>


        <!-- 🌻 SECRET WORD -->

        <div id="secretArea">

            <p>Know the secret word? 🌻</p>

            <div class="secretInput">

                <input
                    type="text"
                    id="secretWord"
                    placeholder="Enter secret word..."
                    autocomplete="off"
                >

                <button id="unlockButton" type="button">
                    🔓 UNLOCK
                </button>

            </div>

            <p id="secretMessage"></p>

        </div>


        <!-- 🌻 BEGIN BUTTON -->

        <button id="startButton" type="button">
            BEGIN →
        </button>


        <!-- 🌻 SUNFLOWER GARDEN -->

        <div class="garden">

            <div class="sunflower flower1"></div>
            <div class="sunflower flower2"></div>
            <div class="sunflower flower3"></div>
            <div class="sunflower flower4"></div>
            <div class="sunflower flower5"></div>
            <div class="sunflower flower6"></div>
            <div class="sunflower flower7"></div>
            <div class="sunflower flower8"></div>
            <div class="sunflower flower9"></div>
            <div class="sunflower flower10"></div>

        </div>


        <div class="garden">

            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>
            <div class="plant">🌻<span>🌿</span></div>

        </div>

    </main>


    <!-- 💻 JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
