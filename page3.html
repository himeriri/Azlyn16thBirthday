<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make a Wish 🎂</title>

    <link rel="stylesheet" href="page3.css">

</head>


<body>

    <main class="page3">

        <h1>Make a Wish! 🌻</h1>

        <p class="instruction">
            Click the candles to blow them out! 🕯️
        </p>


        <!-- ✨ SPARKLES -->

        <div class="sparkle sparkle1">✦</div>
        <div class="sparkle sparkle2">✧</div>
        <div class="sparkle sparkle3">✦</div>
        <div class="sparkle sparkle4">✧</div>


        <!-- 🎂 CAKE -->

        <div class="cake-area">

            <div class="candles">

                <div class="candle" data-candle="1">
                    <div class="flame">🔥</div>
                    <div class="stick"></div>
                </div>

                <div class="candle" data-candle="2">
                    <div class="flame">🔥</div>
                    <div class="stick"></div>
                </div>

                <div class="candle" data-candle="3">
                    <div class="flame">🔥</div>
                    <div class="stick"></div>
                </div>

                <div class="candle" data-candle="4">
                    <div class="flame">🔥</div>
                    <div class="stick"></div>
                </div>

                <div class="candle" data-candle="5">
                    <div class="flame">🔥</div>
                    <div class="stick"></div>
                </div>

            </div>


            <div class="cake">

                <div class="cake-top"></div>

                <div class="cake-body">

                    <div class="decoration">🌻</div>
                    <div class="decoration">🌻</div>
                    <div class="decoration">🌻</div>

                </div>

            </div>

        </div>


        <!-- 🎉 MESSAGE -->

        <div id="wishMessage">

            <h2>✨ Make a wish, Az! ✨</h2>

            <p>
                Happy 16th birthday! 🌻
            </p>

        </div>


        <!-- 💌 NEXT -->

        <button id="nextButton">

            NEXT → 💌

        </button>

    </main>


    <script src="page3.js"></script>

</body>

</html>
